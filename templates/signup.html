<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PaveVision AI - Sign Up</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:linear-gradient(
                135deg,
                #24c6dc,
                #1e73ea
            );

            overflow:hidden;
        }

        .container{

            width:1300px;

            height:760px;

            background:white;

            border-radius:30px;

            overflow:hidden;

            display:flex;

            box-shadow:0 25px 60px rgba(0,0,0,0.25);
        }

        /* LEFT SIDE */

        .left{

            width:55%;

            position:relative;

            overflow:hidden;
        }

        .left img{

            width:100%;

            height:100%;

            object-fit:cover;
        }

        /* RIGHT SIDE */

        .right{

            width:45%;

            background:#ffffff;

            padding:70px;

            display:flex;

            flex-direction:column;

            justify-content:center;
        }

        .tabs{

            display:flex;

            gap:40px;

            margin-bottom:50px;

            font-size:18px;

            font-weight:600;
        }

        .tabs a{

            text-decoration:none;

            color:#666;

            padding-bottom:8px;
        }

        .active{

            color:#13b5c8 !important;

            border-bottom:4px solid #13b5c8;
        }

        h1{

            font-size:72px;

            line-height:78px;

            color:#0c6f82;

            margin-bottom:20px;

            font-weight:700;
        }

        .subtitle{

            font-size:20px;

            color:#777;

            margin-bottom:55px;
        }

        .input-box{

            margin-bottom:30px;
        }

        .input-box input{

            width:100%;

            padding:18px 10px;

            border:none;

            border-bottom:2px solid #d9d9d9;

            font-size:18px;

            outline:none;

            background:#f7f9fc;
        }

        .signup-btn{

            width:100%;

            padding:18px;

            border:none;

            border-radius:14px;

            background:#13b5c8;

            color:white;

            font-size:24px;

            cursor:pointer;

            margin-top:20px;

            transition:0.3s;
        }

        .signup-btn:hover{

            background:#0f95a5;
        }

        .bottom-text{

            margin-top:35px;

            text-align:center;

            font-size:18px;
        }

        .bottom-text a{

            color:#13b5c8;

            text-decoration:none;

            font-weight:600;
        }

    </style>

</head>

<body>

    <div class="container">

        <!-- LEFT PANEL -->

        <div class="left">

            <img
                src="{{ url_for('static', filename='road_ai.png') }}"
                alt="PaveVision AI"
            >

        </div>

        <!-- RIGHT PANEL -->

        <div class="right">

            <div class="tabs">

                <a href="/login">
                    Login
                </a>

                <a href="/signup" class="active">
                    Sign Up
                </a>

            </div>

            <h1>
                Create<br>
                Account
            </h1>

            <p class="subtitle">
                Join PaveVision AI platform
            </p>

            <form method="POST">

                <div class="input-box">

                    <input
                        type="text"
                        name="username"
                        placeholder="Username"
                        required
                    >

                </div>

                <div class="input-box">

                    <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="signup-btn"
                >
                    Create Account
                </button>

            </form>

            <div class="bottom-text">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </div>

        </div>

    </div>

</body>
