<!DOCTYPE html>
<html>
<head>

    <title>Uploads</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-dark text-light">

<div class="container mt-5">

    <h1 class="mb-4">
        📂 Uploaded Files
    </h1>

    <a href="/" class="btn btn-info mb-4">
        ← Back to Dashboard
    </a>

    <table class="table table-dark table-striped">

        <thead>

            <tr>
                <th>ID</th>
                <th>File Name</th>
                <th>Upload Time</th>
            </tr>

        </thead>

        <tbody>

            {% for file in uploads %}

            <tr>
                <td>{{ file[0] }}</td>
                <td>{{ file[1] }}</td>
                <td>{{ file[2] }}</td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>
